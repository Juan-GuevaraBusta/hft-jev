[project]
name = "hft-jev"
version = "0.1.0"
description = "AI-native investment research platform (demonstration harness)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "langchain>=1.4.5",
    "langchain-openrouter>=0.2.9",
    "langfuse>=4.17.0",
    "pydantic>=2.12",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/hft_jev"]

# ---- Ruff ----
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".cursor",
    ".venv",
    "scripts/create_github_backlog.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["hft_jev"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"

# ---- mypy ----
[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "backend/src"
files = ["backend/src", "backend/tests"]

# ---- pytest ----
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: unit tests (fast, no external dependencies)",
    "integration: integration tests (require Floci/PostgreSQL)",
]

# ---- coverage ----
[tool.coverage.run]
source = ["hft_jev"]
branch = true

[tool.coverage.paths]
source = ["backend/src/hft_jev"]
